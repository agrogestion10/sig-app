<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2e5e3e">
<title>Sistema de Gestión Integral</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%232e5e3e'/%3E%3Cpath d='M14 31c0-10 8-17 21-17-1 12-7 20-17 20-1.5 0-3-.3-4-.8M17 33c3-6 7-10 12-13' fill='none' stroke='%23e8f3ea' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #2e5e3e; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="sig" name="sig" title="Sistema de Gestión Integral" allow="clipboard-write; geolocation"
  src="https://script.google.com/macros/s/AKfycbwl_3Nj0lQo2oiSbB-4iEKqktQLZtETjmAILhgou3lL73qi2peLpYW-ZZ8AAqW6lce3/exec"></iframe>
<script>
  // Página de entrada del sistema (aplicación de Google Apps Script).
  var ENTRADA = 'https://script.google.com/macros/s/AKfycbwl_3Nj0lQo2oiSbB-4iEKqktQLZtETjmAILhgou3lL73qi2peLpYW-ZZ8AAqW6lce3/exec';
  var marco = document.getElementById('sig');

  // Solo se abren aplicaciones de Apps Script (nada de otros sitios).
  function permitido(u) {
    return typeof u === 'string' &&
      /^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec(\?|#|$)/.test(u);
  }

  // El sistema le pide a esta página que abra cada pantalla, para que todo se quede aquí adentro.
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    if (d.sig === 'hola') { if (e.source) e.source.postMessage({ sig: 'ok' }, e.origin); return; }
    if (d.sig === 'inicio') { marco.src = ENTRADA; return; }
    if (!permitido(d.url)) return;
    if (d.sig === 'ir') { marco.src = d.url; return; }
    if (d.sig === 'post') {
      var f = document.createElement('form');
      f.method = d.metodo === 'get' ? 'get' : 'post';
      f.action = d.url;
      f.target = 'sig';
      (d.campos || []).forEach(function (c) {
        var i = document.createElement('input');
        i.type = 'hidden'; i.name = c[0]; i.value = c[1];
        f.appendChild(i);
      });
      document.body.appendChild(f);
      f.submit();
      f.parentNode.removeChild(f);
    }
  });
</script>
</body>
</html>
